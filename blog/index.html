---
layout: default
title: Blog
---
<div class="wrap">
  <h1>Blog</h1>
  <p class="lede">The latest writing from our members. Each post opens on the writer's own Substack.</p>
  <div class="post-grid">
    {% for post in site.data.feed %}
      {% include post-card.html post=post %}
    {% else %}
      <p class="meta">No posts yet.</p>
    {% endfor %}
  </div>
</div>
