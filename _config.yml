title: First Few Books
description: An eclectic group of early-career writers based in London.
url: "https://firstfewbooks.com"
baseurl: ""

markdown: kramdown
timezone: Europe/London
# Lets books with a future publication date show in the shop.
future: true

# Members' events sheet, published to the web as CSV (see scripts/fetch_events.py).
events_sheet_csv:

collections:
  members:
    output: true
    permalink: /writers/:name/
  books:
    output: false

defaults:
  - scope:
      path: ""
      type: members
    values:
      layout: member

exclude:
  - README.md
  - scripts
  - .DS_Store
