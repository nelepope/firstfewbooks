title: First Few Books
description: A writing group for authors working on their first few books.
url: "https://firstfewbooks.com"
baseurl: ""

markdown: kramdown
timezone: Europe/London
# Lets books with a future publication date show in the shop.
future: true

permalink: /blog/:year/:month/:title/

collections:
  members:
    output: true
    permalink: /members/:name/
  books:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: members
    values:
      layout: member

exclude:
  - README.md
  - .DS_Store
