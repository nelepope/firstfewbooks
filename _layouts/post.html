---
layout: default
---
{% assign author = site.members | where: "slug", page.author | first %}
<article class="wrap narrow post">
  <header class="post-header">
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if author %}
      <a class="byline" href="{{ author.url | relative_url }}">
        {% include avatar.html member=author %}
        <span>{{ author.name }}</span>
      </a>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
