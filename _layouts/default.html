<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.collection == "members" %}{% assign page_title = page.name %}{% else %}{% assign page_title = page.title %}{% endif %}
  <title>{% if page_title %}{{ page_title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Josefin+Sans:ital,wght@0,300..400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  {% if page.home %}
  <script>
    // Hide the header logo while the big title is on screen.
    (function () {
      var title = document.querySelector('.hero-title');
      if (!title || !('IntersectionObserver' in window)) return;
      new IntersectionObserver(function (entries) {
        document.body.classList.toggle('title-visible', entries[0].isIntersecting);
      }, { rootMargin: '-68px 0px 0px 0px' }).observe(title);
    })();
  </script>
  {% endif %}
</body>
</html>
