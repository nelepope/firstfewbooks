{% if include.member.photo %}
  <img class="avatar{% if include.large %} avatar-lg{% endif %}" src="{{ include.member.photo | relative_url }}" alt="{{ include.member.name }}">
{% else %}
  {% assign parts = include.member.name | remove_first: "Dr " | split: " " %}
  <div class="avatar avatar-initials{% if include.large %} avatar-lg{% endif %}" aria-hidden="true">{{ parts.first | slice: 0 }}{% if parts.size > 1 %}{{ parts.last | slice: 0 }}{% endif %}</div>
{% endif %}
